[package]
name = "guandan"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = { version = "0.8", features = ["ws"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time", "net"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
rand = "0.9"
tracing = "0.1"
tracing-subscriber = "0.3"

[dev-dependencies]
tokio = { version = "1", features = ["test-util"] }   # tokio::time::pause() in Room tests
tokio-tungstenite = "0.26"
futures-util = "0.3"                                  # SinkExt/StreamExt for the smoke-test client
